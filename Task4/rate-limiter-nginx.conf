http {
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;
    limit_req_status 429;

    server {
        listen 80;

        # Новый URI для веб-приложения
        location /api/web/ {
            limit_req zone=web burst=200;
            proxy_pass http://backend/api/;
        }

        # Новый URI для мобильного приложения
        location /api/mobile/ {
            limit_req zone=mobile burst=200;
            proxy_pass http://backend/api/;
        }
        
        # Временно оставляем старый URI, чтобы у клиентов было время на миграцию
        location /api/ {
            limit_req zone=one burst=200;
            proxy_pass http://backend;
        }
    }
}